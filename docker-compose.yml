services:

  # ---------------- Infra ----------------

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

  zipkin:
    image: openzipkin/zipkin
    container_name: zipkin
    restart: unless-stopped
    ports:
      - "9411:9411"

  # ---------------- Platform ----------------

  config-server:
    build: ./config-server
    container_name: config-server
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m -Dserver.port=8888"
      MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans

  discovery-server:
    build: ./discovery-server
    container_name: discovery-server
    restart: unless-stopped
    depends_on:
      - config-server
    ports:
      - "8761:8761"
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m -Dserver.port=8761"
      MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    restart: unless-stopped
    depends_on:
      - discovery-server
      - redis
    ports:
      - "8080:8080"
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m -Dserver.port=8080 -Deureka.client.serviceUrl.defaultZone=http://discovery-server:8761/eureka"
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      SPRING_DATA_REDIS_HOST: redis

  order-service:
    build: ./order-service
    container_name: order-service
    restart: unless-stopped
    depends_on:
      discovery-server:
        condition: service_started
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8081:8081"
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m -Dserver.port=8081 -Deureka.client.serviceUrl.defaultZone=http://discovery-server:8761/eureka"
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/flipkart_orders?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_PASSWORD: root123
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  payment-service:
    build: ./payment-service
    container_name: payment-service
    restart: unless-stopped
    depends_on:
      - discovery-server
      - kafka
    ports:
      - "8082:8082"
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m -Dserver.port=8082 -Deureka.client.serviceUrl.defaultZone=http://discovery-server:8761/eureka"
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  notification-service:
    build: ./notification-service
    container_name: notification-service
    restart: unless-stopped
    depends_on:
      - discovery-server
      - kafka
    ports:
      - "8083:8083"
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m -Dserver.port=8083 -Deureka.client.serviceUrl.defaultZone=http://discovery-server:8761/eureka"
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  catalog-service:
    build: ./catalog-service
    container_name: catalog-service
    restart: unless-stopped
    depends_on:
      - discovery-server
      - mongodb
    ports:
      - "8084:8084"
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m -Dserver.port=8084 -Deureka.client.serviceUrl.defaultZone=http://discovery-server:8761/eureka"
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/flipkart_catalog

  delivery-service:
    build: ./delivery-service
    container_name: delivery-service
    restart: unless-stopped
    depends_on:
      discovery-server:
        condition: service_started
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8085:8085"
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m -Dserver.port=8085 -Deureka.client.serviceUrl.defaultZone=http://discovery-server:8761/eureka"
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/flipkart_delivery?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_PASSWORD: root123
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  pickup-service:
    build: ./pickup-service
    container_name: pickup-service
    restart: unless-stopped
    depends_on:
      - discovery-server
      - mongodb
    ports:
      - "8086:8086"
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m -Dserver.port=8086 -Deureka.client.serviceUrl.defaultZone=http://discovery-server:8761/eureka"
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/flipkart_pickup

  refund-service:
    build: ./refund-service
    container_name: refund-service
    restart: unless-stopped
    depends_on:
      discovery-server:
        condition: service_started
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8087:8087"
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m -Dserver.port=8087 -Deureka.client.serviceUrl.defaultZone=http://discovery-server:8761/eureka"
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/flipkart_refunds?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_PASSWORD: root123
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

volumes:
  mysql-data:
  mongo-data: