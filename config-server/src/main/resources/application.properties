spring.application.name=config-server
server.port=8888

spring.cloud.config.server.git.uri=https://github.com/Asit527/Microservice-Projects.git
spring.cloud.config.server.git.default-label=main
spring.cloud.config.server.git.search-paths=configs
spring.cloud.config.server.git.force-pull=true

eureka.client.enabled=false

management.tracing.sampling.probability=1.0
management.tracing.export.zipkin.endpoint=http://localhost:9411/api/v2/spans